name: terraform

on:
  pull_request:
    paths: ["infra/terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/terraform/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.9"
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - run: terraform fmt -check -recursive -diff

      - name: validate + test every module (offline, mocked providers)
        run: |
          set -euo pipefail
          for dir in $(find . -name versions.tf -not -path '*/.terraform/*' -exec dirname {} \; | sort); do
            echo "::group::${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false
            terraform -chdir="${dir}" validate
            if [ -d "${dir}/tests" ]; then terraform -chdir="${dir}" test; fi
            echo "::endgroup::"
          done

      - run: tflint --init && tflint --recursive --config "$PWD/.tflint.hcl"

      - name: misconfiguration scan
        # Pinned by SHA: tags were force-pushed in the March 2026 compromise
        # (CVE-2026-33634). v0.35.0 is the release that was not affected.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          # The action's default (v0.69.3) skips checks that need >= 0.72.0.
          # Never use v0.69.4: that binary was the compromised release.
          version: v0.76.2
