# Versioned, signed releases. Triggered by pushing a tag vMAJOR.MINOR.PATCH, or
# vMAJOR.MINOR.PATCH-rc.N for a release candidate. Release candidates go through
# exactly the same build, signing and publishing, but the GitHub Release is marked
# as a pre-release and `helm install` skips the chart unless `--devel` is passed.
# Artifacts are versioned without the leading "v" (tag v1.2.3 -> 1.2.3), because the
# chart's default image tag is its appVersion, which Helm requires to be plain semver.
# Produces:
#  - Multi-arch container images in GHCR, signed keyless with cosign (Sigstore),
#    with SLSA build provenance and an SBOM attached.
#  - A Terraform module bundle + SHA256SUMS, signed with cosign sign-blob.
#  - A GitHub Release with install/upgrade notes.
# Customers verify with the commands in docs/release/verifying-releases.md.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore keyless signing
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        service: [api, worker]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/aip-${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Stay on cosign v2: v3 signs in a new bundle format by default, which
      # customers verifying with cosign v2 may not read. Move to v3 only with
      # an update to docs/release/verifying-releases.md and a release note.
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.5
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Sign image by digest
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      # SLSA provenance and an SBOM are already attached to the image by the build
      # step above and covered by the cosign signature. This additionally stores a
      # GitHub attestation (for `gh attestation verify`), which GitHub only offers
      # for public repositories on our plan, so it is skipped while the repo is private.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  bundle:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Stay on cosign v2: v3 signs in a new bundle format by default, which
      # customers verifying with cosign v2 may not read. Move to v3 only with
      # an update to docs/release/verifying-releases.md and a release note.
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.5
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1
      # `helm registry login` below stores credentials only in Helm's own config.
      # cosign reads the Docker config, so it needs this login to sign the chart.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package, push and sign Helm chart
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          owner_lc="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          # Point the packaged chart's default registry at this release's images.
          sed -i -E "s#imageRegistry: ghcr.io/[^[:space:]]+#imageRegistry: ghcr.io/${owner_lc}#" deploy/helm/aip/values.yaml
          mkdir -p dist
          helm package deploy/helm/aip --version "$version" --app-version "$version" -d dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          digest=$(helm push "dist/aip-${version}.tgz" "oci://ghcr.io/${owner_lc}/charts" 2>&1 | tee /dev/stderr | awk '/^Digest:/ {print $2}')
          test -n "$digest"
          cosign sign --yes "ghcr.io/${owner_lc}/charts/aip@${digest}"

      - name: Package Terraform modules
        run: |
          set -euo pipefail
          mkdir -p dist
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@${SOURCE_DATE_EPOCH:-0}" \
            -czf "dist/aip-terraform-${GITHUB_REF_NAME}.tar.gz" -C infra terraform
          (cd dist && sha256sum * > SHA256SUMS)
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      # Release assets need a GitHub login while the repository is private, so the
      # Terraform bundle is also published to GHCR, next to the chart, where
      # customers can pull and verify it anonymously.
      - uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4
        with:
          version: 1.3.6

      - name: Push and sign Terraform bundle
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          owner_lc="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          ref="ghcr.io/${owner_lc}/terraform/aip"
          cd dist
          digest=$(oras push "${ref}:${version}" \
            --artifact-type application/vnd.aip.terraform.bundle.v1 \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.version=${version}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --format json \
            "aip-terraform-${GITHUB_REF_NAME}.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip" | jq -r .digest)
          test -n "$digest" && test "$digest" != null
          cosign sign --yes "${ref}@${digest}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-rc.* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "${prerelease[@]}"
