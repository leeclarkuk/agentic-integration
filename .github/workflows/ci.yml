name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NX_DAEMON: "false"
  NX_NO_CLOUD: "true"

jobs:
  affected:
    name: lint / typecheck / test / build (affected)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      projects: ${{ steps.list.outputs.projects }}
      run_e2e: ${{ steps.list.outputs.run_e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nx needs history to diff against the base SHA

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked

      # Sets NX_BASE / NX_HEAD: PRs diff against the merge-base; main diffs against
      # the last green commit on main, so a red build doesn't shrink the next diff.
      - uses: nrwl/nx-set-shas@v4

      # Local Nx cache persisted between runs. Swap for a remote cache once
      # multiple runners need to share hits (see docs/adr/0001-monorepo-tooling.md).
      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'uv.lock') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'uv.lock') }}-
            nx-${{ runner.os }}-

      - run: pnpm biome ci .
      - run: pnpm nx affected -t lint typecheck test build --outputStyle=static

      - id: list
        run: |
          projects=$(pnpm -s nx show projects --affected --json | jq -r 'join(",")')
          echo "projects=${projects}" >> "$GITHUB_OUTPUT"
          if [[ ",${projects}," == *",@aip/e2e,"* ]]; then echo "run_e2e=true" >> "$GITHUB_OUTPUT"; fi
          echo "### Affected projects" >> "$GITHUB_STEP_SUMMARY"
          echo "${projects:-none}" | tr ',' '\n' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: e2e (affected suites)
    needs: affected
    if: needs.affected.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: docker/setup-buildx-action@v3

      - name: Build and start stack
        run: docker compose -f deploy/compose/docker-compose.yml up -d --build --wait
      - run: pnpm install --frozen-lockfile
      - name: Run affected e2e suites
        env:
          # main runs everything; PRs run only suites for affected projects.
          E2E_PROJECTS: ${{ github.ref == 'refs/heads/main' && 'all' || needs.affected.outputs.projects }}
        run: pnpm --filter @aip/e2e e2e
      - name: Service logs
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color --tail=500
      - if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down -v

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3
        with:
          extra_args: --results=verified,unknown
