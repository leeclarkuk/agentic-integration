name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NX_DAEMON: "false"
  NX_NO_CLOUD: "true"

jobs:
  affected:
    name: lint / typecheck / test / build (affected)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      projects: ${{ steps.list.outputs.projects }}
      run_e2e: ${{ steps.list.outputs.run_e2e }}
      run_helm: ${{ steps.list.outputs.run_helm }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nx needs history to diff against the base SHA

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1 # the Helm major most customers run; chart must also pass on v4 (see helm-install)
      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kc.tgz https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tgz -C /usr/local/bin kubeconform

      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked

      # Sets NX_BASE / NX_HEAD: PRs diff against the merge-base; main diffs against
      # the last green commit on main, so a red build doesn't shrink the next diff.
      - uses: nrwl/nx-set-shas@v4

      # Local Nx cache persisted between runs. Swap for a remote cache once
      # multiple runners need to share hits (see docs/adr/0001-monorepo-tooling.md).
      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'uv.lock') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'uv.lock') }}-
            nx-${{ runner.os }}-

      - run: pnpm biome ci .
      - run: pnpm nx affected -t lint typecheck test build --outputStyle=static

      - id: list
        run: |
          projects=$(pnpm -s nx show projects --affected --json | jq -r 'join(",")')
          echo "projects=${projects}" >> "$GITHUB_OUTPUT"
          if [[ ",${projects}," == *",@aip/e2e,"* ]]; then echo "run_e2e=true" >> "$GITHUB_OUTPUT"; fi
          if [[ ",${projects}," == *",@aip/helm-chart,"* ]]; then echo "run_helm=true" >> "$GITHUB_OUTPUT"; fi
          echo "### Affected projects" >> "$GITHUB_STEP_SUMMARY"
          echo "${projects:-none}" | tr ',' '\n' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: e2e (affected suites)
    needs: affected
    if: needs.affected.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: docker/setup-buildx-action@v3

      - name: Build and start stack
        run: docker compose -f deploy/compose/docker-compose.yml up -d --build --wait
      - run: pnpm install --frozen-lockfile
      - name: Run affected e2e suites
        env:
          # main runs everything; PRs run only suites for affected projects.
          E2E_PROJECTS: ${{ github.ref == 'refs/heads/main' && 'all' || needs.affected.outputs.projects }}
        run: pnpm --filter @aip/e2e e2e
      - name: Service logs
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color --tail=500
      - if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down -v

  helm-install:
    name: helm install + test (kind, helm ${{ matrix.helm }})
    needs: affected
    # Services are implicit deps of the chart, so image changes also re-run this.
    if: needs.affected.outputs.run_helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        helm: [v3.22.1, v4.3.1]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: ${{ matrix.helm }}
      - uses: helm/kind-action@v1
        with:
          cluster_name: aip
      - name: Build images and load into kind
        run: |
          for svc in api worker; do
            docker build -f "apps/${svc}/Dockerfile" -t "aip/aip-${svc}:ci" .
            kind load docker-image --name aip "aip/aip-${svc}:ci"
          done
      - name: Install chart
        run: |
          helm install aip deploy/helm/aip --namespace aip --create-namespace --wait --timeout 5m \
            --set global.imageRegistry=aip \
            --set components.api.image.tag=ci --set components.api.image.pullPolicy=Never \
            --set components.worker.image.tag=ci --set components.worker.image.pullPolicy=Never \
            --set telemetry.enabled=false
      - name: Upgrade in place (install ID must survive)
        run: |
          before=$(kubectl -n aip get secret aip-install -o jsonpath='{.data.installId}')
          helm upgrade aip deploy/helm/aip --namespace aip --reuse-values --wait --timeout 5m
          after=$(kubectl -n aip get secret aip-install -o jsonpath='{.data.installId}')
          test -n "$before" && test "$before" = "$after"
      - run: helm test aip --namespace aip --logs
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n aip get all,events --sort-by=.lastTimestamp
          kubectl -n aip describe pods
          kubectl -n aip logs -l app.kubernetes.io/instance=aip --all-containers --tail=200

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No floating major tag upstream; pinned to a release commit (v3.99.7). Dependabot bumps it.
      - uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2
        with:
          extra_args: --results=verified,unknown
