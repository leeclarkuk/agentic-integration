version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
    ignore:
      # cosign-installer v4 installs cosign v3, which changes the signature
      # format customers verify. See the comment in release.yml.
      - dependency-name: sigstore/cosign-installer
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      dev-tooling:
        dependency-type: development
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directories: ["/infra/terraform/modules/*/*", "/infra/terraform/byoc/*"]
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: ["/apps/*"]
    schedule: { interval: weekly }
