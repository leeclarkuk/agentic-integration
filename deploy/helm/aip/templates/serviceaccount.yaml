{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aip.serviceAccountName" . }}
  labels:
    {{- include "aip.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Workloads opt in to a token only via cloud workload identity; no Kubernetes API access needed.
automountServiceAccountToken: false
{{- end }}
