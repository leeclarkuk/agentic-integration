apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aip.installSecretName" . }}
  labels:
    {{- include "aip.labels" . | nindent 4 }}
  annotations:
    # Survive `helm uninstall` so a reinstall keeps the same installation identity.
    helm.sh/resource-policy: keep
type: Opaque
data:
  installId: {{ include "aip.installId" . | b64enc | quote }}
