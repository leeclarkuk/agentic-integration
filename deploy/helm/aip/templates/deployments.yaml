{{- range $name, $c := .Values.components }}
{{- if $c.enabled }}
{{- $ctx := dict "root" $ "component" $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aip.componentName" $ctx }}
  labels:
    {{- include "aip.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  {{- if not $c.autoscaling.enabled }}
  replicas: {{ $c.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "aip.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aip.labels" $ | nindent 8 }}
        {{- include "aip.selectorLabels" $ctx | nindent 8 }}
      annotations:
        # Datadog unified service tagging + log source.
        ad.datadoghq.com/{{ $name }}.logs: '[{"source":"{{ $name }}","service":"{{ $name }}"}]'
    spec:
      serviceAccountName: {{ include "aip.serviceAccountName" $ }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "aip.selectorLabels" $ctx | nindent 14 }}
      containers:
        - name: {{ $name }}
          image: {{ include "aip.image" (dict "root" $ "image" $c.image) | quote }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $c.port }}
              protocol: TCP
          env:
            - name: AIP_VERSION
              value: {{ $.Chart.AppVersion | quote }}
            - name: AIP_EDITION
              value: {{ $.Values.edition | quote }}
            - name: AIP_CLOUD
              value: {{ $.Values.global.cloud | quote }}
            - name: LOG_LEVEL
              value: {{ $.Values.logLevel | quote }}
            - name: PORT
              value: {{ $c.port | quote }}
            - name: DD_SERVICE
              value: {{ $name | quote }}
            - name: DD_VERSION
              value: {{ $.Chart.AppVersion | quote }}
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: AIP_INSTALL_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "aip.installSecretName" $ }}
                  key: installId
            - name: AIP_CALL_HOME_ENDPOINT
              value: {{ $.Values.telemetry.endpoint | quote }}
            {{- if not $.Values.telemetry.enabled }}
            - name: AIP_TELEMETRY_DISABLED
              value: "1"
            {{- end }}
            {{- range $k, $v := $c.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- with $.Values.connections.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
